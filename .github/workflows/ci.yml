# CI: Python tools tests, and the VS Code extension built, packaged and smoke-tested as a .vsix
# in a real VS Code (vscode-extension/test/smoke). No LLM calls: the conceptual-test run of the
# smoke test only happens locally, with CONTEXTDOC_TEST_MODEL set.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tools (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/*/requirements.txt
      - name: Install dependencies
        run: pip install -r tools/ctx-run/requirements.txt -r tools/ctx-watch/requirements.txt pytest
      - name: ctx-run tests
        working-directory: tools/ctx-run
        run: python -m pytest -q
      - name: ctx-watch tests
        working-directory: tools/ctx-watch
        run: python -m pytest -q

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - name: Type-check and compile
        run: npx tsc -p ./
      - name: Package
        run: npx vsce package --out contextdoc.vsix
      - name: Cache VS Code download
        uses: actions/cache@v4
        with:
          path: vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('vscode-extension/package-lock.json') }}
      - name: Smoke test of the packaged extension
        run: xvfb-run -a node test/smoke/run.js contextdoc.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: contextdoc-vsix
          path: vscode-extension/contextdoc.vsix
